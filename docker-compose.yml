version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: trainfleet-db
    restart: always
    environment:
      MYSQL_DATABASE: trainfleetmanager
      MYSQL_USER: manager
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: trainfleet-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/trainfleetmanager
      SPRING_DATASOURCE_USERNAME: manager
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  db_data:
